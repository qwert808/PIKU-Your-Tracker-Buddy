<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with squircle safe-zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- 24-hour Ring background -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="24" opacity="0.4" />
  
  <!-- Colored 24h Progress Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="24"
    stroke-linecap="round" stroke-dasharray="820 1005" transform="rotate(-90 256 256)" filter="url(#glow)" />
  
  <!-- Inner Circle with Dark Center -->
  <circle cx="256" cy="256" r="115" fill="#1e293b" />
  
  <!-- Stylized P & Checkmark -->
  <path d="M 210 170 L 210 342 M 210 170 L 280 170 C 315 170, 315 250, 280 250 L 210 250" 
    stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Dynamic check badge -->
  <circle cx="320" cy="300" r="42" fill="url(#checkGrad)" filter="url(#glow)" />
  <path d="M 304 300 L 316 312 L 338 290" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>
